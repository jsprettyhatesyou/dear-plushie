<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>dear plushie!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #F8DDE3;
    --pink-deep: #F2C4D0;
    --cream: #FFF9F5;
    --plush: #C69C84;
    --plush-deep: #A57E68;
    --milk: #E8D9CF;
    --lavender: #C8B6E2;
    --peach: #FFD6C2;
    --ink: #4A3B36;
    --ink-soft: #7B675F;
    --ink-faint: #B49E94;
    --shadow-soft: 0 8px 24px rgba(198, 156, 132, 0.18);
    --shadow-card: 0 2px 0 rgba(198, 156, 132, 0.10), 0 10px 28px rgba(198, 156, 132, 0.16);
    --shadow-press: 0 1px 0 rgba(198, 156, 132, 0.18);
  }
  html, body {
    margin: 0; padding: 0; min-height: 100dvh;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 20% 10%, #FCE9EE 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, #F3E6F7 0%, transparent 45%),
      linear-gradient(180deg, #FFF4EE 0%, #FBEAF0 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    width: 100%;
    box-sizing: border-box;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
    gap: 24px;
  }
  .stage {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 14px;
  }
  .stage-caption {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  /* ────────────────────────────────────────────────
     RESPONSIVE — under 768px, drop the device frame
     and render as a native mobile web app.
     ──────────────────────────────────────────────── */
  .mobile-shell {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    position: relative;
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
  }
  .mobile-shell .mobile-status-spacer {
    height: env(safe-area-inset-top, 0px);
  }
  @media (max-width: 767px) {
    body {
      display: block;
      padding: 0;
      gap: 0;
      align-items: stretch;
      justify-content: stretch;
    }
    body::before, body::after { display: none !important; }
    .stage-caption { display: none; }
    /* hard safety net — hide the desktop iPhone frame on real mobile */
    .stage { display: none !important; }
    .mobile-shell { display: block !important; }
    .app-toast {
      position: fixed !important;
      bottom: calc(110px + env(safe-area-inset-bottom, 0px));
      left: 20px; right: 20px;
      max-width: 390px; margin: 0 auto;
    }
  }
  @media (min-width: 768px) {
    .mobile-shell { display: none !important; }
    .stage { display: flex !important; }
    .app-toast {
      position: fixed !important;
      bottom: 60px; left: 50%; transform: translateX(-50%);
      max-width: 360px;
    }
  }
  .app-toast {
    z-index: 60;
    background: rgba(74, 59, 54, 0.9);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff;
    padding: 12px 18px; border-radius: 20px;
    font-family: 'Fredoka', system-ui; font-weight: 500; font-size: 14px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(74,59,54,0.3);
  }
  /* floating sparkles on body backdrop */
  body::before, body::after {
    content: ''; position: fixed; pointer-events: none;
    border-radius: 50%; background: rgba(255,255,255,0.6);
    filter: blur(0.5px);
  }
  body::before { width: 6px; height: 6px; top: 18%; left: 12%; box-shadow:
    140px 80px 0 -1px rgba(255,255,255,.55),
    280px -40px 0 -2px rgba(255,255,255,.45),
    420px 200px 0 -1px rgba(255,255,255,.55),
    -80px 320px 0 -2px rgba(255,255,255,.45),
    560px 380px 0 -1px rgba(255,255,255,.5),
    700px 60px 0 -2px rgba(255,255,255,.4),
    900px 240px 0 -1px rgba(255,255,255,.5);
  }
  body::after { width: 4px; height: 4px; bottom: 18%; right: 14%; box-shadow:
    -200px -160px 0 0 rgba(255, 214, 194, .35),
    -400px 60px 0 -1px rgba(200, 182, 226, .35),
    -640px -280px 0 0 rgba(248, 221, 227, .5),
    -880px -100px 0 -1px rgba(255, 214, 194, .4);
  }

  /* utility: tiny float */
  @keyframes float-soft {
    0%, 100% { transform: translateY(0) rotate(var(--r,0deg)); }
    50% { transform: translateY(-4px) rotate(var(--r,0deg)); }
  }
  .float-soft { animation: float-soft 3.6s ease-in-out infinite; }
  @keyframes sway-claw {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }
  @keyframes pop-in {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop-in { animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes envelope-unfurl {
    0% { transform: rotateX(-180deg); opacity: 0; }
    100% { transform: rotateX(0deg); opacity: 1; }
  }
  @keyframes letter-rise {
    0% { transform: translateY(40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes heart-beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fade-in 0.4s ease-out both; }

  /* tweaks panel typography tweaks */
  .twk-panel { font-family: 'Inter', system-ui !important; }

  /* hide scrollbars inside the device */
  .device-scroll::-webkit-scrollbar { display: none; }
  .device-scroll { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="firebase-integration.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
